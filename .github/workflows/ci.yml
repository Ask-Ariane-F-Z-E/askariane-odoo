name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Byte-compile the addon
        run: python -m compileall -q ariane_dialer

      - name: Ruff (syntax and undefined names only)
        run: |
          pip install ruff==0.6.9
          ruff check --select E9,F63,F7,F82 ariane_dialer

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Panel JS tests (no Odoo needed)
        run: node --test ariane_dialer/static/tests/
